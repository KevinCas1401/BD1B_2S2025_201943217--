version: "3.9"

services:
  oracle-db:
  
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe
    ports:
      - "11521:1521"             # Oracle listener
    environment:
      ORACLE_PASSWORD: "Admin123"      # SYS/SYSTEM
      APPUSER_PASSWORD: "AppUser123"   # para crear APPUSER en init
      ORACLE_CHARACTERSET: "AL32UTF8"
    volumes:
      - ./db/init:/container-entrypoint-initdb.d
      - ./db/oradata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "bash", "-lc", "echo 'select 1 from dual;' | sqlplus -s system/Admin123@localhost:1521/XEPDB1"]
      interval: 15s
      timeout: 5s
      retries: 30

  api:
    build: ./api
    container_name: api-node
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_USER: APPUSER
      DB_PASSWORD: AppUser123
      DB_CONNECTSTRING: oracle-db:1521/XEPDB1
      PORT: 3000
    ports:
      - "3000:3000"

